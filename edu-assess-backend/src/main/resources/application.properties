spring.application.name= backend

# Server
server.port=8080

# ===============================
# DATABASE (PostgreSQL - adjust for your environment)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/education_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# JWT
# JWT Config with Default Secret Key Fallback
jwt.auth.app=authapp
# IMPORTANT: REPLACE THIS WITH A SECURELY GENERATED BASE64 KEY
# Use the KeyGeneratorUtil Java class to generate a random one.
jwt.auth.secret_key=${JWT_KEY:MzYwZGJlNjVjLTBiNGEtNGRiOS05ZDVhLTAxNjgyNmQzNmEzZAo=}
jwt.auth.expires_in=86400

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=Education Platform API
springdoc.info.description=REST API for assessments, users, and analytics
springdoc.info.version=v1.0

# ===============================
# Logging
# ===============================
logging.level.com.example.educationbackend=DEBUG

# ===============================
# Custom properties
# ===============================
app.frontend-url=http://localhost:3000